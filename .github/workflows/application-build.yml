
name: CI/CD for app

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select application action"
        required: true
        type: choice
        options:
          - build-push
          - delete-images
        default: build-push

  # push:
  #   branches:
  #     - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"
  BACKEND_SERVICE: "backend"

permissions:
  contents: write

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  deploy:
    name: Build and Push Images
    if: ${{ inputs.action == 'build-push' }}
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}

      # -------------------------
      # AWS Credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Verify AWS Account
      # -------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -------------------------
      # ECR Login
      # -------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Build and Push Images
      # -------------------------
      - name: Build and Push Docker Images
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA}"

          # -------- Frontend --------
          for service in $FRONTEND_SERVICES; do
            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "No Dockerfile in $FOLDER, skipping..."
              continue
            fi

            echo "Building frontend: $service"

            if ! aws ecr describe-repositories \
              --repository-names "$REPO_NAME" >/dev/null 2>&1; then
              aws ecr create-repository \
                --repository-name "$REPO_NAME" \
                --image-scanning-configuration scanOnPush=true
            fi

            docker build -t "$IMAGE_URI" "$FOLDER"
            docker push "$IMAGE_URI"

            if [ -f "$FOLDER/deployment.yml" ]; then
              sed -i "s|image:.*|image: $IMAGE_URI|g" \
                "$FOLDER/deployment.yml"
            fi
          done

          # -------- Backend --------
          FOLDER="backend"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          if [ ! -f "$FOLDER/Dockerfile" ]; then
            echo "Backend Dockerfile not found."
            exit 1
          fi

          echo "Building backend"

          if ! aws ecr describe-repositories \
            --repository-names "$REPO_NAME" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --image-scanning-configuration scanOnPush=true
          fi

          docker build -t "$IMAGE_URI" "$FOLDER"
          docker push "$IMAGE_URI"

          if [ -f "$FOLDER/backend-deployment.yml" ]; then
            sed -i "s|image:.*|image: $IMAGE_URI|g" \
              "$FOLDER/backend-deployment.yml"
          fi

      # -------------------------
      # Commit YAML changes
      # -------------------------
      - name: Commit updated YAML files
        shell: bash
        run: |
          set -e

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add frontend backend

          if git diff --cached --quiet; then
            echo "No YAML changes to commit."
          else
            git commit -m "Update image tags after build [skip ci]"
            git push origin HEAD:main
          fi

  # ============================================================
  # DELETE ECR IMAGES
  # ============================================================
  delete-ecr-images:
    name: Delete All ECR Images
    if: ${{ inputs.action == 'delete-images' }}
    runs-on: ubuntu-latest

    # Configure required reviewers in this GitHub Environment
    environment:
      name: ecr-delete-approval

    steps:

      # -------------------------
      # AWS Credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Verify AWS Account
      # -------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -------------------------
      # Login to ECR
      # -------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Delete Images
      # -------------------------
      - name: Delete All Images from ECR Repositories
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORIES=""

          for service in $FRONTEND_SERVICES; do
            REPOSITORIES="$REPOSITORIES shopping-site-$service"
          done

          REPOSITORIES="$REPOSITORIES shopping-site-$BACKEND_SERVICE"

          for repo in $REPOSITORIES; do

            echo "======================================"
            echo "Processing repository: $repo"
            echo "======================================"

            if ! aws ecr describe-repositories \
              --repository-names "$repo" >/dev/null 2>&1; then
              echo "Repository $repo does not exist. Skipping."
              continue
            fi

            IMAGE_IDS=$(aws ecr list-images \
              --repository-name "$repo" \
              --filter tagStatus=ANY \
              --query 'imageIds[*]' \
              --output json)

            if [ "$IMAGE_IDS" = "[]" ]; then
              echo "No images found in $repo."
              continue
            fi

            # Delete images in batches of up to 100
            echo "$IMAGE_IDS" | jq -c '
              . as $items |
              [range(0; length; 100) as $i |
              $items[$i:$i+100]][]
            ' | while IFS= read -r batch; do

              echo "Deleting image batch from $repo"

              aws ecr batch-delete-image \
                --repository-name "$repo" \
                --image-ids "$batch" \
                --output json

            done

            echo "Finished processing $repo"
          done

          echo "ECR image deletion workflow completed."

      # -------------------------
      # Verify Image Deletion
      # -------------------------
      - name: Verify ECR Images
        shell: bash
        run: |
          set -euo pipefail

          for service in $FRONTEND_SERVICES; do
            repo="shopping-site-$service"

            if aws ecr describe-repositories \
              --repository-names "$repo" >/dev/null 2>&1; then

              count=$(aws ecr list-images \
                --repository-name "$repo" \
                --filter tagStatus=ANY \
                --query 'length(imageIds)' \
                --output text)

              echo "$repo: $count remaining image IDs"
            fi
          done

          repo="shopping-site-$BACKEND_SERVICE"

          if aws ecr describe-repositories \
            --repository-names "$repo" >/dev/null 2>&1; then

            count=$(aws ecr list-images \
              --repository-name "$repo" \
              --filter tagStatus=ANY \
              --query 'length(imageIds)' \
              --output text)

            echo "$repo: $count remaining image IDs"
          fi
